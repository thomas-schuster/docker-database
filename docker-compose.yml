services:
  db:
    image: ngmondial
    hostname: db
    build: .
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mondial}
      # Diese Variablen werden vom init.sh Skript verwendet
      MONDIAL_USER: ${MONDIAL_USER:-mondial}
      MONDIAL_PASSWORD: ${MONDIAL_PASSWORD:-mondial!}
      MONDIAL_DB: ${MONDIAL_DB:-mondial}

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-user@hs-pforzheim.de}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
    volumes:
      - ./servers.json:/pgadmin4/servers.json
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgadmin-data: