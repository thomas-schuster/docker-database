services:
  db:
    image: ngmondial
    container_name: mondial-db
    hostname: db
    build: .
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mondial}
      MONDIALUSER: ${MONDIAL_USER:-mondial}
      USERPASSWORD: ${MONDIAL_PASSWORD:-mondial!}
      MONDIALDB: ${MONDIAL_DB:-mondial}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mondial -d mondial"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mondial-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-user@hs-pforzheim.de}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
    volumes:
      - ./servers.json:/pgadmin4/servers.json
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  superset:
    image: apache/superset:latest
    container_name: mondial-superset
    user: root
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "MondialDBSupersetSecretKey2024!"
      TALISMAN_ENABLED: "False"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - superset-data:/app/superset_home
    command: >
      bash -c "
        pip install psycopg2-binary --target=/app/.venv/lib/python3.10/site-packages/ --quiet &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@hs-pforzheim.de --password admin 2>/dev/null || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload
      "

volumes:
  pgadmin-data:
  superset-data:
